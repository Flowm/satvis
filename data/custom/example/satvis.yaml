# Example plugin config. Every data/custom/*/satvis.yaml is merged into the core
# config by worker/scripts/generate-groups.mjs at build time.
#
# A config contributes three independent sections, all optional:
#   groups     — what is served, as which unit, and under which tags
#   presets    — the starting configuration of a route, /<name>, which needs
#                a rewrite in public/_redirects (see satvis.core.yaml)
#   satellites — static per-satellite facts, keyed by NORAD id, attached to
#                matching records wherever they are served

groups:
  - name: iss
    sources: [{ celestrak: stations }]
    satellites:
      # A group row selects and renames. Its optional `metadata` goes into the merged
      # satellite table under its noradId, so it applies wherever the record is served.
      # Without a row, use the top-level `satellites` table below.
      - { noradId: 25544, upstreamName: ISS (ZARYA), name: ISS }

# Static facts keyed by NORAD id alone (`name` is documentation only). Empty on
# purpose: the generator merges this example into every build. Uncomment to try it.
#
# Swath extents are PER-SIDE cross-track distances (km) from the ground track,
# relative to flight direction (starboard = velocity bearing + 90°) — not halves of
# a full width, and given for both sides or neither.
#
# satellites:
#   - { noradId: 25544, name: ISS, swathStarboardKm: 100, swathPortKm: 100, coneFovDeg: 45 }
