packages:
  - worker

catalog:
  typescript: ^6.0.3
  oxlint: ^1.82.0
  oxfmt: ^0.67.0

# typescript held at 6.x: The TS7 programmatic API needed for vue-tsc will only be available with TS7.1
# https://github.com/vuejs/language-tools/issues/5381#issuecomment-4950412322
updateConfig:
  ignoreDependencies:
    - typescript

allowBuilds:
  core-js: false
  esbuild: false
  sharp: false
  vue-demi: true
  workerd: true

# Hoist a few transitive packages to the root node_modules so they resolve
# under pnpm's strict (non-flat) layout, matching npm's old flat layout:
#   - workbox-window : the virtual:pwa-register module from vite-plugin-pwa
#                      re-exports workbox-window, resolved from the project root.
publicHoistPattern:
  - "workbox-window"
