packages:
  - worker

catalog:
  typescript: ^6.0.3
  oxlint: ^1.86.0
  oxfmt: ^0.71.0

# typescript held at 6.x: The TS7 programmatic API needed for vue-tsc will only be available with TS7.1
# https://github.com/vuejs/language-tools/issues/5381#issuecomment-4950412322
updateConfig:
  ignoreDependencies:
    - typescript

allowBuilds:
  core-js: false
  esbuild: false
  sharp: false
  vue-demi: true
  workerd: true

# vite-plugin-pwa's virtual:pwa-register re-exports workbox-window, resolved from the project root.
publicHoistPattern:
  - "workbox-window"
