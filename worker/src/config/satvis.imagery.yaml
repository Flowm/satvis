# The imagery manifest: which layer of which imagery provider shows which instrument
# of which satellite (ADR 0019). scripts/generate-groups.mjs gives each satellite its
# `imagery` from it; the schema is ImageryManifest in src/gp/types.ts.
#
# Hand-written: no provider says in a machine-readable way which satellite a layer
# shows. Listed is the picture people look for first, at the providers that state a
# licence for it: an instrument's true colour or natural colour, and the day-and-night
# blend a provider makes of it (GeoColor). An instrument's first entry is its default.
# Left out are its variants (enhanced, surface reflectance, MISR's other cameras) and
# the false colour and weather composites: 106 more layers at GIBS and EUMETView,
# counted per instrument in docs/proposals/imagery-availability.md.
#
# `maxLevel` and `format` are what an app needs to draw the layer itself (ADR 0020):
# the deepest level worth asking for, in 256-pixel Web Mercator tiles, and the tiles'
# type. For GIBS that is the layer's `GoogleMapsCompatible_LevelN` tile set. EUMETView
# draws any tile, so there it is the first level finer than the picture's own pixels
# under the satellite, measured from a tile on 2026-11-12. An entry without them is a
# link only.
#
# `granules` lists the collections that list a layer's granules: NASA CMR's by concept id,
# the near-real-time one first, as CMR's id pins a collection and its version where short
# names repeat (MODIS's near-real-time and standard collections are both MOD03), or one of
# EUMETSAT's Data Store. `platform` names the satellite in a collection that lists several.
# An entry with `granules` is one the web app replays behind the clock, each granule in its
# outline (ADR 0023), and its `period` is the granules':
# - a GIBS layer of one granule a frame;
# - a EUMETView layer, each granule cut from the frame stamped nearest its start plus
#   `frame`;
# - a `cmr` entry, its granules cut from the frames of `pictures`: a daily layer's (`frame:
#   day`) or a EUMETView one's, as above. Without `pictures`, `kind: outline`, it is a
#   satellite's granule outlines where no provider has their pixels.
# Every collection here was read on 2026-11-21 or 22; the comment beside its ids names them.
#
# Layer ids, periods, first frames and tile sets were read from each provider's
# capabilities on 2026-11-11. Re-check an entry there before copying it: a layer that stops keeps its
# place in the capabilities, so nothing there says it has ended.

satellites:
  - noradId: 25994
    name: TERRA
    instruments:
      MODIS:
        - provider: gibs
          layer: MODIS_Terra_CorrectedReflectance_TrueColor
          label: True colour
          kind: rgb
          maxLevel: 9
          format: jpeg
          period: P1D
          start: 2000-02-24
        # MOD03 6.1NRT, MOD03 6.1: the geolocation, which every MODIS product shares. Each
        # granule cut from the day's picture above.
        - provider: cmr
          layer: MOD03
          label: True colour
          kind: rgb
          period: PT5M
          start: 2000-02-24
          granules: [C1426422512-LANCEMODIS, C1379767668-LAADS]
          pictures: { provider: gibs, layer: MODIS_Terra_CorrectedReflectance_TrueColor, frame: day }
      MISR:
        # Ended. The nadir camera's, one of nine.
        - provider: gibs
          layer: MISR_AM1_Ellipsoid_Radiance_RGB_AN
          label: True colour, nadir camera
          kind: rgb
          maxLevel: 9
          format: png
          period: P1D
          start: 2017-09-01
          end: 2022-10-12

  - noradId: 27424
    name: AQUA
    instruments:
      MODIS:
        - provider: gibs
          layer: MODIS_Aqua_CorrectedReflectance_TrueColor
          label: True colour
          kind: rgb
          maxLevel: 9
          format: jpeg
          period: P1D
          start: 2002-07-03
        # MYD03 6.1NRT, MYD03 6.1, as Terra's.
        - provider: cmr
          layer: MYD03
          label: True colour
          kind: rgb
          period: PT5M
          start: 2002-07-04
          granules: [C1426640814-LANCEMODIS, C1379841358-LAADS]
          pictures: { provider: gibs, layer: MODIS_Aqua_CorrectedReflectance_TrueColor, frame: day }

  - noradId: 37849
    name: SUOMI NPP
    instruments:
      VIIRS:
        # Ended: NOAA stopped the satellite's science data on 2026-11-02.
        # https://www.nesdis.noaa.gov/news/cessation-of-suomi-national-polar-orbiting-partnership-s-npp-data-users-onafter-november-2-2026
        - provider: gibs
          layer: VIIRS_SNPP_CorrectedReflectance_TrueColor
          label: True colour
          kind: rgb
          maxLevel: 9
          format: jpeg
          period: P1D
          start: 2015-11-24
          end: 2026-11-02
        # VNP03MOD 2. Its near-real-time collection, VNP03MOD_NRT, has none left; GIBS keeps
        # the granules 90 days, to the end of January 2027.
        - provider: gibs
          layer: VIIRS_SNPP_CorrectedReflectance_TrueColor_Granule
          label: True colour
          kind: rgb
          maxLevel: 9
          format: png
          period: PT6M
          end: 2026-11-02
          window: P90D
          granules: [C2105092427-LAADS]

  - noradId: 43013
    name: NOAA 20 (JPSS-1)
    instruments:
      VIIRS:
        - provider: gibs
          layer: VIIRS_NOAA20_CorrectedReflectance_TrueColor
          label: True colour
          kind: rgb
          maxLevel: 9
          format: jpeg
          period: P1D
          start: 2018-01-05
        # One frame a 6-minute granule, transparent outside it; read 2026-11-21. GIBS has no
        # frame of a daytime granule centred past about 50° N or 54° S, 43 to 46 of a day's
        # 115, Europe north of the Alps among them (2026-09-20, 11-10 and 11-22): those keep
        # their outline.
        - provider: gibs
          layer: VIIRS_NOAA20_CorrectedReflectance_TrueColor_Granule
          label: True colour
          kind: rgb
          maxLevel: 9
          format: png
          period: PT6M
          window: P90D
          granules: [C2208781576-LANCEMODIS, C2105084593-LAADS] # VJ103MOD_NRT 2.1, VJ103MOD 2.1

  - noradId: 54234
    name: NOAA 21 (JPSS-2)
    instruments:
      VIIRS:
        - provider: gibs
          layer: VIIRS_NOAA21_CorrectedReflectance_TrueColor
          label: True colour
          kind: rgb
          maxLevel: 9
          format: jpeg
          period: P1D
          start: 2023-02-10
        # GIBS has no NOAA-21 granule layer (read 2026-11-21): each granule cut from the
        # day's picture above, until it has one.
        - provider: cmr
          layer: VJ203MOD
          label: True colour
          kind: rgb
          period: PT6M
          start: 2023-02-10
          granules: [C3383721151-LANCEMODIS, C3478458790-LAADS] # VJ203MOD_NRT 2.1, VJ203MOD 2.1
          pictures: { provider: gibs, layer: VIIRS_NOAA21_CorrectedReflectance_TrueColor, frame: day }

  - noradId: 58928
    name: PACE
    instruments:
      OCI:
        - provider: gibs
          layer: OCI_PACE_True_Color
          label: True colour
          kind: rgb
          maxLevel: 7
          format: jpeg
          period: P1D
          start: 2024-02-25
        # PACE_OCI_L1B_SCI 3: by day only, as OCI senses. Cut from the day's picture above.
        - provider: cmr
          layer: PACE_OCI_L1B_SCI
          label: True colour
          kind: rgb
          period: PT5M
          start: 2024-03-05
          granules: [C3392966952-OB_CLOUD]
          pictures: { provider: gibs, layer: OCI_PACE_True_Color, frame: day }
      SPEXone:
        - provider: gibs
          layer: SPEXONE_PACE_True_Color
          label: True colour
          kind: rgb
          maxLevel: 7
          format: png
          period: P1D
          start: 2025-08-21
      HARP2:
        # Ended.
        - provider: gibs
          layer: HARP2_PACE_True_Color
          label: True colour
          kind: rgb
          maxLevel: 7
          format: png
          period: P1D
          start: 2025-08-21
          end: 2026-06-19

  - noradId: 38771
    name: METOP-B
    instruments:
      AVHRR/3:
        # Six orbits stacked, not one swath, so no period.
        - provider: eumetview
          layer: eps:m01_rgb_natural_fog
          label: Natural colour and fog, six orbits stacked
          kind: rgb
          maxLevel: 6
          format: png
          start: 2020-09-01
        # AVHRRF_MB-STAR-L2P 2.80: NOAA's sea surface temperature from the AVHRR, whose
        # 10-minute granules are its swath's, an hour behind live, with no day or night of
        # their own. Each cut from the orbits stacked above, from the frame where its orbit is
        # the newest: EUMETView stamps a frame when its newest orbit ends, 20 to 55 minutes
        # after a day granule starts (measured on Metop-B and C, 2026-10-02 and 11-18/21).
        - provider: cmr
          layer: AVHRRF_MB-STAR-L2P
          label: Natural colour
          kind: rgb
          period: PT10M
          start: 2012-10-19
          granules: [C2205121394-POCLOUD]
          pictures: { provider: eumetview, layer: eps:m01_rgb_natural_fog, frame: PT35M }

  - noradId: 43689
    name: METOP-C
    instruments:
      AVHRR/3:
        - provider: eumetview
          layer: eps:m03_rgb_natural_fog
          label: Natural colour and fog, six orbits stacked
          kind: rgb
          maxLevel: 6
          format: png
          start: 2020-09-01
        # AVHRRF_MC-STAR-L2P 2.80, as Metop-B's.
        - provider: cmr
          layer: AVHRRF_MC-STAR-L2P
          label: Natural colour
          kind: rgb
          period: PT10M
          start: 2018-12-04
          granules: [C2205121400-POCLOUD]
          pictures: { provider: eumetview, layer: eps:m03_rgb_natural_fog, frame: PT35M }

  - noradId: 41335
    name: SENTINEL-3A
    instruments:
      OLCI:
        # A swath an orbit, cut to the granules of OL_1_EFR___, by day only, as EUMETSAT's
        # Data Store lists them: 2 hours behind live, where CMR's OLCIS3A_L1_EFR is 26, and
        # from 2024-07-26. EUMETView stamps a swath about when its day pass ended, so a
        # granule's start plus `frame` is within 50 minutes of it (measured 2021 to 2026-11-22).
        - provider: eumetview
          layer: copernicus:sentinel3a_olci_l1_rgb_fullres
          label: True colour
          kind: rgb
          maxLevel: 8
          format: png
          period: PT3M
          start: 2020-02-17
          granules: [EO:EUM:DAT:0409]
          platform: Sentinel-3A
          frame: PT25M

  - noradId: 43437
    name: SENTINEL-3B
    instruments:
      OLCI:
        # As Sentinel-3A's.
        - provider: eumetview
          layer: copernicus:sentinel3b_olci_l1_rgb_fullres
          label: True colour
          kind: rgb
          maxLevel: 8
          format: png
          period: PT3M
          start: 2020-02-17
          granules: [EO:EUM:DAT:0409]
          platform: Sentinel-3B
          frame: PT25M

  # NASA's harmonized Landsat and Sentinel-2 scenes (HLS 2.0): a 110 km tile each, over land
  # and by day, about three days behind live. CMR lists them by satellite; GIBS's daily
  # picture of each pair holds both.
  - noradId: 39084
    name: LANDSAT 8
    instruments:
      OLI:
        - provider: cmr
          layer: HLSL30.LANDSAT-8
          label: True colour
          kind: rgb
          period: PT1M
          start: 2013-04-11
          granules: [C2021957657-LPCLOUD]
          platform: LANDSAT-8
          pictures: { provider: gibs, layer: HLS_L30_Nadir_BRDF_Adjusted_Reflectance, frame: day }

  - noradId: 49260
    name: LANDSAT 9
    instruments:
      OLI-2:
        - provider: cmr
          layer: HLSL30.LANDSAT-9
          label: True colour
          kind: rgb
          period: PT1M
          granules: [C2021957657-LPCLOUD]
          platform: LANDSAT-9
          pictures: { provider: gibs, layer: HLS_L30_Nadir_BRDF_Adjusted_Reflectance, frame: day }

  - noradId: 40697
    name: SENTINEL-2A
    instruments:
      MSI (Sentinel-2):
        - provider: cmr
          layer: HLSS30.Sentinel-2A
          label: True colour
          kind: rgb
          period: PT1M
          start: 2015-11-28
          granules: [C2021957295-LPCLOUD]
          platform: Sentinel-2A
          pictures: { provider: gibs, layer: HLS_S30_Nadir_BRDF_Adjusted_Reflectance, frame: day }

  - noradId: 42063
    name: SENTINEL-2B
    instruments:
      MSI (Sentinel-2):
        # HLS has no Sentinel-2C scenes yet (read 2026-11-22).
        - provider: cmr
          layer: HLSS30.Sentinel-2B
          label: True colour
          kind: rgb
          period: PT1M
          granules: [C2021957295-LPCLOUD]
          platform: Sentinel-2B
          pictures: { provider: gibs, layer: HLS_S30_Nadir_BRDF_Adjusted_Reflectance, frame: day }

  # The layers below are named for a service, not a satellite: GOES-East, Meteosat's
  # full disc. Each is listed under the satellite that provides the service now, and
  # its `start` is the day that satellite took over, from the operator's notice, where
  # the layer has earlier frames: those are another satellite's. No provider publishes
  # who provides a service, so a handover is made here by hand: move the entries and
  # set `start`.

  - noradId: 60133
    name: GOES 19
    instruments:
      ABI:
        # GOES-East since 2025-04-07: https://www.ospo.noaa.gov/data/messages/2025/04/MSG_20250407_1510.html
        # GIBS keeps a geostationary layer 90 days, whatever its time domain lists.
        - provider: gibs
          layer: GOES-East_ABI_GeoColor
          label: GeoColor
          kind: rgb
          maxLevel: 7
          format: png
          period: PT10M
          window: P90D

  - noradId: 51850
    name: GOES 18
    instruments:
      ABI:
        # GOES-West since 2023-01-04: https://ospo.noaa.gov/data/messages/2023/01/MSG_20230104_1805.html
        - provider: gibs
          layer: GOES-West_ABI_GeoColor
          label: GeoColor
          kind: rgb
          maxLevel: 7
          format: png
          period: PT10M
          window: P90D

  # Meteosat has two services at 0°: the full disc of the third generation's FCI
  # (EUMETView's `mtg_fd`), and that of the second generation's SEVIRI (`msg_fes`),
  # which runs on beside it.

  - noradId: 54743
    name: METEOSAT-12 (MTG-I1)
    instruments:
      FCI:
        # The only imager of its generation so far, so the service's from its first frame.
        - provider: eumetview
          layer: mtg_fd:rgb_geocolour
          label: GeoColour
          kind: rgb
          maxLevel: 7
          format: png
          period: PT10M
          start: 2024-09-23
        - provider: eumetview
          layer: mtg_fd:rgb_truecolour
          label: True colour
          kind: rgb
          maxLevel: 7
          format: png
          period: PT10M
          start: 2024-09-23

  - noradId: 38552
    name: METEOSAT-10 (MSG-3)
    instruments:
      SEVIRI:
        # The 0° service: https://osi-saf.eumetsat.int/community/list-of-service-messages/meteosat-10meteosat-11-swap-operations-planned-21032023
        - provider: eumetview
          layer: msg_fes:rgb_natural
          label: Natural colour
          kind: rgb
          maxLevel: 6
          format: png
          period: PT15M
          start: 2023-03-21

  - noradId: 28912
    name: METEOSAT-9 (MSG-2)
    instruments:
      SEVIRI:
        # The Indian Ocean service at 45.5°E: https://www.eumetsat.int/msg-services
        - provider: eumetview
          layer: msg_iodc:rgb_natural
          label: Natural colour
          kind: rgb
          maxLevel: 6
          format: png
          period: PT15M
          start: 2022-06-01

  - noradId: 40732
    name: METEOSAT-11 (MSG-4)
    instruments:
      SEVIRI:
        # The rapid scan of Europe at 9.5°E: https://ospo.noaa.gov/data/messages/2023/03/MSG_20230315_1608.html
        - provider: eumetview
          layer: msg_rss:rgb_natural_nrt
          label: Natural colour, Europe
          kind: rgb
          maxLevel: 6
          format: png
          period: PT5M
          start: 2023-03-28

# Composites: layers that show several satellites at once, not told apart. Each is listed
# once, with the satellites it shows; each of them gets it, `merged`, after its own entries.
# A satellite's `start` is the day it took over its position, where the layer is older.
composites:
  # A Copernicus Browser `layer` is a dataset id of
  # https://browser.dataspace.copernicus.eu/datasets.txt: the whole constellation's, a
  # link, never one unit's layer.
  - provider: copernicus-browser
    layer: S3OLCI_CDAS
    label: True colour scenes
    kind: rgb
    satellites:
      - { noradId: 41335, name: SENTINEL-3A, instrument: OLCI }
      - { noradId: 43437, name: SENTINEL-3B, instrument: OLCI }

  - provider: copernicus-browser
    layer: S2_L2A_CDAS
    label: True colour scenes
    kind: rgb
    satellites:
      - { noradId: 40697, name: SENTINEL-2A, instrument: MSI (Sentinel-2) }
      - { noradId: 42063, name: SENTINEL-2B, instrument: MSI (Sentinel-2) }
      - { noradId: 60989, name: SENTINEL-2C, instrument: MSI (Sentinel-2) }

  - provider: copernicus-browser
    layer: CDAS_L8_L9_LOTL1
    label: True colour scenes
    kind: rgb
    satellites:
      - { noradId: 39084, name: LANDSAT 8, instrument: OLI }
      - { noradId: 49260, name: LANDSAT 9, instrument: OLI-2 }

  # The geostationary ring, day and night, every hour for the last week: GOES-East,
  # GOES-West, Meteosat at 0° and Himawari joined on one Web Mercator grid by the
  # georing-mosaic project (ADR 0022). A cloud-optimized GeoTIFF of 512-pixel WebP blocks
  # to Web Mercator zoom 8. Nothing poleward of about 81°. Its satellites are its plan's;
  # each frame's credit names those that took part.
  - provider: georing
    layer: mosaic
    label: Day/Night, GeoRing
    kind: rgb
    maxLevel: 8
    format: webp
    period: PT1H
    window: P7D
    satellites:
      - { noradId: 60133, name: GOES 19, instrument: ABI }
      - { noradId: 51850, name: GOES 18, instrument: ABI }
      - { noradId: 54743, name: METEOSAT-12 (MTG-I1), instrument: FCI }
      - { noradId: 41836, name: HIMAWARI-9, instrument: AHI }

  # EUMETSAT's natural colour of the five geostationary imagers in one picture every 3
  # hours (Data Store EO:EUM:DAT:0336). Its pixels are about 0.025°.
  - provider: eumetview
    layer: mumi:wideareacoverage_rgb_natural
    label: Natural colour, GeoRing
    kind: rgb
    maxLevel: 6
    format: png
    period: PT3H
    satellites:
      # GOES-East since 2025-04-07: https://www.ospo.noaa.gov/data/messages/2025/04/MSG_20250407_1510.html
      - { noradId: 60133, name: GOES 19, instrument: ABI, start: 2025-04-07 }
      # GOES-West since 2023-01-04: https://ospo.noaa.gov/data/messages/2023/01/MSG_20230104_1805.html
      - { noradId: 51850, name: GOES 18, instrument: ABI, start: 2023-01-04 }
      - { noradId: 38552, name: METEOSAT-10 (MSG-3), instrument: SEVIRI, start: 2023-03-21 }
      - { noradId: 28912, name: METEOSAT-9 (MSG-2), instrument: SEVIRI, start: 2022-06-01 }
      # Himawari at 140.7°E since 2022-12-13: https://ds.data.jma.go.jp/mscweb/en/oper/status.html
      # Himawari-8 stood in from 2025-10-12 to 2025-11-26 (WMO OSCAR).
      - { noradId: 41836, name: HIMAWARI-9, instrument: AHI, start: 2022-12-13 }
