# Core config: the GP groups and their tags, the presets, and the static
# per-satellite facts. scripts/generate-groups.mjs merges it with every
# data/custom/*/satvis.yaml into satvis.generated.json.

# Ten groups are carved out of `active` by name rather than fetched as their own
# CelesTrak group. Sources are deduped, so this cut a refresh from ~12.2 MB to
# ~7.2 MB (CelesTrak allows 250 MB/day per IP).
#
# Each derivation is a superset of the CelesTrak group (checked 2026-07-29):
#   oneweb, globalstar, iridium-NEXT   exact, record for record
#   starlink    +2  STARLINK-2401/47818, STARLINK-34343/64157
#   planet      +1  PELICAN-11/69871
#   eutelsat    +1  EUTELSAT 53A/40277
#   spire      +12  recent LEMUR-2s (66680, 67366, 68471-68493)
# and on 2026-10-17:
#   kuiper      exact, record for record
#   qianfan     +1  QIANFAN 16 OBJECT K/100711
#   guowang    +17  HULIANWANG JISHU SHIYAN test craft; CelesTrak's `hulianwang`
#                   holds some of them, and names a fresh launch GUOWANG
# The extras are in `active` but not in the curated group; we serve them.
#
# Members without a matching prefix are `satellites` rows: a row's upstreamName is
# checked, so a rename or decay warns in /api/groups.json.
#
# `active-remainder` is `active` minus the ten. A group carved from `active` must
# join its exclude list and carry the `Active` tag (the generator checks both), so
# the pieces are disjoint and no satellite arrives twice.
#
# gnss, science, resource, weather, cubesat, stations and last-30-days have no name
# pattern and stay their own sources.
#
# Re-check a derivation before widening it: patterns drift as operators add
# product lines (planet needed PELICAN, TANAGER and EDDA).
groups:
  - name: active-remainder
    tags: [Active]
    sources: [{ celestrak: active }]
    exclude: [starlink, oneweb, globalstar, iridium-NEXT, planet, spire, eutelsat, kuiper, qianfan, guowang]
  - name: cubesat
    tags: [Cubesat]
    sources: [{ celestrak: cubesat }]
  - name: globalstar
    tags: [Globalstar, Active]
    sources: [{ celestrak: active }]
    select: { namePattern: "^GLOBALSTAR" }
  - name: gnss
    tags: [GNSS]
    sources: [{ celestrak: gnss }]
  - name: iridium-NEXT
    tags: [IridiumNEXT, Active]
    sources: [{ celestrak: active }]
    select: { namePattern: "^IRIDIUM" }
  - name: last-30-days
    tags: [New]
    sources: [{ celestrak: last-30-days }]
  - name: oneweb
    tags: [OneWeb, Active]
    sources: [{ celestrak: active }]
    select: { namePattern: "^ONEWEB" }
  - name: planet
    tags: [Planet, Active]
    sources: [{ celestrak: active }]
    select: { namePattern: "^(FLOCK|SKYSAT|PELICAN|TANAGER|EDDA)" }
  - name: resource
    tags: [Resource]
    sources: [{ celestrak: resource }]
  - name: science
    tags: [Science]
    sources: [{ celestrak: science }]
  - name: spire
    tags: [Spire, Active]
    sources: [{ celestrak: active }]
    select: { namePattern: "^LEMUR" }
    # Spire craft that are not LEMURs.
    satellites:
      - { noradId: 66678, upstreamName: OTTER SDM }
      - { noradId: 67364, upstreamName: TWILIGHT-1 OBJECT B }
  - name: starlink
    tags: [Starlink, Active]
    sources: [{ celestrak: active }]
    select: { namePattern: "^STARLINK" }
  - name: stations
    tags: [Stations]
    sources: [{ celestrak: stations }]
  - name: weather
    tags: [Weather]
    sources: [{ celestrak: weather }]
  - name: eutelsat
    tags: [Eutelsat, Active]
    sources: [{ celestrak: active }]
    select: { namePattern: "^EUTELSAT" }
    # Eutelsat-operated, but catalogued under their Express names.
    satellites:
      - { noradId: 39612, upstreamName: EXPRESS-AT1 }
      - { noradId: 39613, upstreamName: EXPRESS-AT2 }
  - name: kuiper
    tags: [Kuiper, Active]
    sources: [{ celestrak: active }]
    select: { namePattern: "^KUIPER" }
  - name: qianfan
    tags: [Qianfan, Active]
    sources: [{ celestrak: active }]
    select: { namePattern: "^QIANFAN" }
  - name: guowang
    tags: [Guowang, Active]
    sources: [{ celestrak: active }]
    select: { namePattern: "^(HULIANWANG|GUOWANG)" }

# A route's starting configuration: `default` at /, any other at /<name>, which
# also needs a rewrite in public/_redirects.
# `defaults` are url parameters in query-string form (ADR 0001); the url states
# only what differs. Clients drop what they do not know, so only `tags` is checked.
# `groups` are the groups the route registers; `searchOnly: true` puts one in the
# catalog without a group row.
# `featured` are the route's featured bookmarks (ADR 0011): links against `defaults`,
# live and with a group or a single satellite, so they show the present. One without a
# `query` is the default view. The about page shows the default preset's from its own
# copy (about.html), which src/config/featured.test.ts holds to these. `pictureAt` is
# the moment `pnpm update-showcase` pictures, and the App Store screenshots' too
# (ios/scripts/screenshots.sh), with the element sets in scripts/showcase/pinned.json;
# it is not served.
# `benchmark` are the scenes the benchmark measures (ADR 0016), links against `defaults`
# as `featured` are, cheap to heavy. `id` names a scene's fields in a report: keep it when
# the scene keeps its meaning. `paced: true` measures it idle. A preset with none is
# served these, on this route.
presets:
  - name: default
    title: Satvis - 3D Satellite Tracker & Sky View
    defaults: { tags: Weather }
    groups:
      - cubesat
      - globalstar
      - gnss
      - iridium-NEXT
      - last-30-days
      - oneweb
      - planet
      - resource
      - science
      - spire
      - starlink
      - stations
      - weather
      - eutelsat
      - kuiper
      - qianfan
      - guowang
      - active-remainder
    featured:
      - name: Weather satellites
        thumbnail: showcase/globe.webp
        pictureAt: 2026-11-01T08:52Z
      # The ISS alone: the rest of the Stations group crowds the close-up.
      - name: Follow the ISS
        thumbnail: showcase/iss.webp
        pictureAt: 2026-10-04T08:18:30Z
        query: { tags: "", sats: ISS (ZARYA), track: ISS (ZARYA), elements: "Point,Label,Orbit,3D model", layers: VersaTiles }
      # Every active satellite, as many as the sky holds: past the label budget, points alone.
      - name: Sky over Lauterbrunnen
        thumbnail: showcase/sky.webp
        pictureAt: 2026-11-01T17:32Z
        query: { scene: Sky, gs: "46.5935,7.9091,Lauterbrunnen", terrain: ReEarth, layers: VersaTiles, stars: DeepStar2K, tags: Active }
    # The axes of count and component, the 3D model close up and the sky view, which the
    # tests on an iPad mini found to differ most (ios/docs/manual-verification.md), and two idle.
    # The globe alone is the floor under every other scene: in Chrome on an M4 Pro at 2880×1800
    # it took 14.5 ms of GPU a frame, the default view with its 74 satellites 14.3.
    benchmark:
      - { id: default_view, name: Default view · Points and labels }
      - { id: globe, name: Globe · No satellites, query: { tags: "" } }
      - { id: default_view_idle, name: Default view · Idle, paced: true }
      - { id: starlink_points, name: Starlink · Points, query: { tags: Starlink, elements: Point } }
      - { id: active_points, name: All active · Points, query: { tags: Active, elements: Point } }
      - id: weather_all_components
        name: Weather · Every component
        query: { elements: "Point,Label,Orbit,Orbit track,Ground track,Sensor cone" }
      - id: weather_all_components_idle
        name: Weather · Idle
        query: { elements: "Point,Label,Orbit,Orbit track,Ground track,Sensor cone" }
        paced: true
      # 121 nodes an orbit.
      - { id: active_orbits, name: All active · Orbits, query: { tags: Active, elements: "Point,Orbit" } }
      - id: iss_model_tracked
        name: ISS · 3D model, tracked
        query: { tags: "", sats: ISS (ZARYA), track: ISS (ZARYA), elements: "Point,Label,Orbit,3D model" }
      - id: sky_view
        name: Sky view · Lauterbrunnen
        query: { scene: Sky, gs: "46.5935,7.9091,Lauterbrunnen", terrain: ReEarth }
      - id: sky_active
        name: Sky view · All active
        query: { scene: Sky, gs: "46.5935,7.9091,Lauterbrunnen", terrain: ReEarth, tags: Active }

# Static per-satellite facts, matched by NORAD_CAT_ID alone; `name` is documentation
# only. Absent satellites get the defaults in src/config/satelliteMetadata.ts.
#
# Swath extents are per-side cross-track distances (km) from the ground track to the
# swath edge (starboard = velocity bearing + 90°). They are not half a swath width,
# and the sides can differ.
#
# Only LEO imagers: geostationary platforms have no moving swath.
satellites:
  # MODIS (Terra/Aqua) — 2330 km nominal; footprints reach ~1170/side.
  - { noradId: 25994, name: TERRA, swathStarboardKm: 1175, swathPortKm: 1175 }
  - { noradId: 27424, name: AQUA, swathStarboardKm: 1175, swathPortKm: 1175 }

  # VIIRS (JPSS) — 3040 km nominal; L1 footprints reach ~1556/side.
  - { noradId: 37849, name: SUOMI NPP, swathStarboardKm: 1565, swathPortKm: 1565 }
  - { noradId: 43013, name: NOAA 20 (JPSS-1), swathStarboardKm: 1565, swathPortKm: 1565 }
  - { noradId: 54234, name: NOAA 21 (JPSS-2), swathStarboardKm: 1565, swathPortKm: 1565 }

  # MSI (Sentinel-2) — 290 km nominal; L1C tiles reach ~149/side.
  - { noradId: 40697, name: SENTINEL-2A, swathStarboardKm: 150, swathPortKm: 150 }
  - { noradId: 42063, name: SENTINEL-2B, swathStarboardKm: 150, swathPortKm: 150 }
  - { noradId: 60989, name: SENTINEL-2C, swathStarboardKm: 150, swathPortKm: 150 }

  # SLSTR (Sentinel-3) — tilted against sunglint, west on the descending day pass,
  # i.e. starboard (checked against granule footprints: 995-998 / 499-502 km).
  - { noradId: 41335, name: SENTINEL-3A, swathStarboardKm: 1000, swathPortKm: 500 }
  - { noradId: 43437, name: SENTINEL-3B, swathStarboardKm: 1000, swathPortKm: 500 }

  # TROPOMI (Sentinel-5P) — 2600 km nominal, nadir-pointing; NRTI footprints reach ~1366/side.
  - { noradId: 42969, name: SENTINEL-5P, swathStarboardKm: 1375, swathPortKm: 1375 }

  # OLI (Landsat) — 185 km total.
  - { noradId: 39084, name: LANDSAT 8, swathStarboardKm: 92.5, swathPortKm: 92.5 }
  - { noradId: 49260, name: LANDSAT 9, swathStarboardKm: 92.5, swathPortKm: 92.5 }

  # AVHRR/3 (MetOp) — 2900 km total.
  - { noradId: 38771, name: METOP-B, swathStarboardKm: 1450, swathPortKm: 1450 }
  - { noradId: 43689, name: METOP-C, swathStarboardKm: 1450, swathPortKm: 1450 }

  # METimage (MetOp-SG A) — 2670 km design swath, not yet checked against product footprints.
  - { noradId: 65159, name: METOP-SGA1, swathStarboardKm: 1335, swathPortKm: 1335 }

  # MERSI (Fengyun-3) — 2900 km total.
  # Only satellites with a confirmed MERSI variant; 3A/3B/3C and 3G/3H are left out (ADR 0002).
  - { noradId: 43010, name: FENGYUN 3D, swathStarboardKm: 1450, swathPortKm: 1450 }
  - { noradId: 49008, name: FENGYUN 3E, swathStarboardKm: 1450, swathPortKm: 1450 }
  - { noradId: 57490, name: FENGYUN 3F, swathStarboardKm: 1450, swathPortKm: 1450 }

  # SGLI (GCOM-C) — 1150 km total.
  - { noradId: 43065, name: GCOM-C (SHIKISAI), swathStarboardKm: 575, swathPortKm: 575 }
